<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10 - Loguin simples </title>
    <link rel="stylesheet" href="ex10.css">
</head>
<body>
        <main class="container">
    <h1>Loguin Simples</h1>
    <p>Digite o usuário e a senha para testar a validação.</p>

    <label for="usuario">Úsuario:</label>
    <input type="text" id="usuario" placeholder="Digite o usuário">

    <label for="senha">Senha:</label>
    <input type="password" id="senha" placeholder="Digite a senha">

    <div class="botoes">
        <button onclick="verificarLoguin()">Entrar</button>
        <button class="secundario" onclick="LimparCampos ()">Limpar</button>
    </div>

    <p id="resultado">Resultado: </p>
    <p class="dica">Teste com o usuário <strong>aluno</strong> e a senha <strong>1234</strong>.</p>
 </main>

    <script src="ex10.js"></script>
</body>
</html>
